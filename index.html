<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoShare - Index of {{PATH}}</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-brand">
                <a href="/" class="logo">
                    <span class="logo-icon"><i class="fas fa-server"></i></span>
                    <span class="logo-text">NeoShare</span>
                </a>
            </div>
            <div class="header-actions">
                <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
                    <i class="fas fa-moon moon-icon"></i>
                    <i class="fas fa-sun sun-icon"></i>
                </button>
            </div>
        </header>

        <main id="mainContent">
            <!-- Path & Navigation Bar -->
            <!-- Toolbar: Navigation, Search, View Controls -->
            <section class="toolbar" aria-label="File management tools">
                <nav class="breadcrumb-container" id="breadcrumbContainer" aria-label="Breadcrumb"></nav>
                <div class="toolbar-controls">
                    <div class="search-box">
                        <i class="fas fa-search search-icon" aria-hidden="true"></i>
                        <input type="text" id="searchInput" placeholder="Filter files... (Press /)" autocomplete="off">
                        <button id="searchClearBtn" class="search-clear" aria-label="Clear filter" style="display:none;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="view-toggle" role="group" aria-label="View Mode">
                        <button id="viewListBtn" class="btn btn-icon active" title="List View" aria-label="List view">
                            <i class="fas fa-list"></i>
                        </button>
                        <button id="viewGridBtn" class="btn btn-icon" title="Grid View" aria-label="Grid view">
                            <i class="fas fa-grip-horizontal"></i>
                        </button>
                    </div>
                </div>
            </section>
            <div class="current-path-bar" style="display:none;">
                <span id="current-path">{{PATH}}</span>
            </div>

            <!-- Upload Section Placeholder -->
            <div class="upload-section">
                <div class="upload-zone" id="dropZone">
                    <p>Drop files here or click to upload</p>
                    <input type="file" id="fileInput" multiple style="display:none;">
                </div>
            </div>

            <!-- File Explorer Placeholder -->
            <div class="file-explorer">
                <div class="file-list" id="fileList">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>
        </main>
    </div>
    <script src="/script.js"></script>
</body>
</html>
