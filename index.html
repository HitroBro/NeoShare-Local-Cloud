<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoShare - Index of {{PATH}}</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-brand">
                <a href="/" class="logo">
                    <span class="logo-icon"><i class="fas fa-server"></i></span>
                    <span class="logo-text">NeoShare</span>
                </a>
            </div>
            <div class="header-actions">
                <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
                    <i class="fas fa-moon moon-icon"></i>
                    <i class="fas fa-sun sun-icon"></i>
                </button>
            </div>
        </header>

        <main id="mainContent">
            <!-- Path & Navigation Bar -->
            <div class="current-path-bar">
                <span id="current-path">{{PATH}}</span>
            </div>

            <!-- Upload Section Placeholder -->
            <div class="upload-section">
                <div class="upload-zone" id="dropZone">
                    <p>Drop files here or click to upload</p>
                    <input type="file" id="fileInput" multiple style="display:none;">
                </div>
            </div>

            <!-- File Explorer Placeholder -->
            <div class="file-explorer">
                <div class="file-list" id="fileList">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>
        </main>
    </div>
    <script src="/script.js"></script>
</body>
</html>
