<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoShare - Index of {{PATH}}</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-brand">
                <a href="/" class="logo">
                    <span class="logo-icon"><i class="fas fa-server"></i></span>
                    <span class="logo-text">NeoShare</span>
                </a>
            </div>
            <div class="header-actions">
                <button id="downloadFolderBtn" class="btn btn-secondary" title="Download folder as ZIP">
                    <i class="fas fa-file-archive"></i> Download ZIP
                </button>
                <button id="refreshBtn" class="btn btn-icon" title="Refresh files" aria-label="Refresh">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="themeToggleBtn" class="btn btn-icon theme-toggle-btn" aria-label="Toggle theme">
                    <i class="fas fa-moon moon-icon"></i>
                    <i class="fas fa-sun sun-icon"></i>
                </button>
            </div>
        </header>

        <main id="mainContent">
            <!-- Path & Navigation Bar -->
            <!-- Toolbar: Navigation, Search, View Controls -->
            <section class="toolbar" aria-label="File management tools">
                <nav class="breadcrumb-container" id="breadcrumbContainer" aria-label="Breadcrumb"></nav>
                <div class="toolbar-controls">
                    <div class="search-box">
                        <i class="fas fa-search search-icon" aria-hidden="true"></i>
                        <input type="text" id="searchInput" placeholder="Filter files... (Press /)" autocomplete="off">
                        <button id="searchClearBtn" class="search-clear" aria-label="Clear filter" style="display:none;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="view-toggle" role="group" aria-label="View Mode">
                        <button id="viewListBtn" class="btn btn-icon active" title="List View" aria-label="List view">
                            <i class="fas fa-list"></i>
                        </button>
                        <button id="viewGridBtn" class="btn btn-icon" title="Grid View" aria-label="Grid view">
                            <i class="fas fa-grip-horizontal"></i>
                        </button>
                    </div>
                </div>
            </section>
            <div class="current-path-bar" style="display:none;">
                <span id="current-path">{{PATH}}</span>
            </div>

            <!-- Upload Section Placeholder -->
            <div class="upload-section">
                <div class="upload-zone" id="dropZone" tabindex="0" role="button" aria-label="Upload files">
                    <div class="upload-zone-content">
                        <div class="upload-icon-wrapper">
                            <i class="fas fa-cloud-upload-alt upload-cloud-icon"></i>
                        </div>
                        <div class="upload-text">
                            <p class="upload-title font-semibold">Drop files here, or <span class="browse-link">browse</span></p>
                            <p class="upload-subtitle text-xs">Supports files up to 2GB</p>
                        </div>
                    </div>
                    <p>Drop files here or click to upload</p>
                    <input type="file" id="fileInput" multiple style="display:none;">
                </div>
            </div>

            <!-- File Explorer Placeholder -->
            <div class="file-explorer">
                <div class="explorer-header" id="explorerHeader">
                    <div class="header-name sortable" id="sortName" role="button" tabindex="0">
                        Name <i class="fas fa-sort sort-icon"></i>
                    </div>
                    <div class="header-size sortable" id="sortSize" role="button" tabindex="0">
                        Size <i class="fas fa-sort sort-icon"></i>
                    </div>
                    <div class="header-modified sortable" id="sortModified" role="button" tabindex="0">
                        Modified <i class="fas fa-sort sort-icon"></i>
                    </div>
                    <div class="header-actions">Actions</div>
                </div>
                <div class="file-list" id="fileList">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>
            <!-- Upload Progress Component -->
            <div id="uploadProgressContainer" class="upload-progress-card" style="display:none;">
                <div class="upload-progress-header">
                    <span id="uploadProgressName" class="font-medium text-sm">Uploading...</span>
                    <span id="uploadProgressPercent" class="text-xs text-muted">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div id="uploadProgressBar" class="progress-bar-fill"></div>
                </div>
            </div>
        </main>
    
        <!-- Media Preview Modal -->
        <div id="previewModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-hidden="true">
            <div class="modal-dialog">
                <header class="modal-header">
                    <h3 id="previewTitle" class="modal-title font-semibold text-base">File Preview</h3>
                    <div class="modal-actions">
                        <a id="previewDownloadBtn" href="#" class="btn btn-icon" download title="Download file">
                            <i class="fas fa-download"></i>
                        </a>
                        <button id="previewCloseBtn" class="btn btn-icon" aria-label="Close modal">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </header>
                <div id="previewBody" class="modal-body"></div>
            </div>
        </div>
    </div>
    <script src="/script.js"></script>
</body>
</html>
