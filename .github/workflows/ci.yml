name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Code Quality
        run: |
          pip install ruff --break-system-packages
          ruff check .

      - name: Run Test Suite
        run: |
          python3 -m unittest discover -s tests -v
