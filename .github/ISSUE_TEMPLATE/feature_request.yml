---
name: Feature Request
description: Suggest an idea for NeoShare
title: "[Feature]: "
labels: ["Feature Request"]
assignees: ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature for NeoShare!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "Currently, NeoShare doesn't support X..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see.
      placeholder: "Add support for X by..."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context or references.
    validations:
      required: false